<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP-Mosaico Experience · UI Preview</title>
<style>
:root{--bg:#0b1220;--panel:#111b30;--line:#26385c;--text:#e8eefc;--dim:#90a3c7;--cyan:#3fd0e6;--gold:#e8b45a;--warn:#f2a93b;--err:#f2635b;--ok:#52d68a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Hiragino Sans","PingFang SC","Noto Sans CJK SC",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:16px}.sim{background:#3a2a0a;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 10px;font-size:12px}
main{display:grid;grid-template-columns:minmax(480px,500px) 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.screen{position:relative;width:480px;height:480px;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#000;touch-action:none;cursor:pointer}
.screen img{display:block;width:480px;height:480px;user-select:none;-webkit-user-drag:none}
.col{display:grid;gap:12px;align-content:start}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
h2{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.04em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select{background:#18284a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--cyan)}button.on{background:#12485a;border-color:var(--cyan)}
input[type=range]{width:160px}label{color:var(--dim);font-size:12px}
.pad{width:150px;height:150px;border:1px solid var(--line);border-radius:10px;position:relative;background:#0a1426;touch-action:none;cursor:crosshair}
.pad i{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);left:50%;top:50%}
.pad span{position:absolute;color:#52668f;font-size:11px}
#state{font:12px/1.4 ui-monospace,Menlo,monospace;color:#9bb0d8;white-space:pre-wrap;max-height:210px;overflow:auto}
#fx{font:12px ui-monospace,Menlo,monospace;color:var(--gold);min-height:3.2em}
.note{color:var(--dim);font-size:12px}
.badge{display:inline-block;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.badge.bad{border-color:var(--err);color:var(--err)}.badge.good{border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>
<header>
  <b>ESP-Mosaico Experience · UI 预览（Host 模拟器）</b><span class="sim">SIM · 合成传感器数据</span>
  <span class="note">仅本机 127.0.0.1 · 无硬件 · 无无线功能 · 这不是实机或 RF 验证</span>
</header>
<main>
  <div class="col">
    <div class="screen" id="screen"><img id="frame" alt="screen" draggable="false"></div>
    <section>
      <h2>屏幕布局检查 / 状态</h2>
      <div class="row"><span class="badge" id="b_layout">布局：—</span><span class="badge" id="b_page">页面：—</span><span class="badge" id="b_rate">—</span></div>
      <div class="row"><label><input type="checkbox" id="dbg_layout" checked> 记录布局问题</label><label><input type="checkbox" id="dbg_long"> 长文本压力测试</label><button id="shot">保存截图</button></div>
      <div id="state"></div>
    </section>
  </div>
  <div class="col">
    <section>
      <h2>姿态（合成 IMU：BMI270 / BMM150 模拟）</h2>
      <div class="row">
        <div class="pad" id="pad"><i id="padDot"></i><span style="left:50%;top:2px;transform:translateX(-50%)">顶边抬起 ▲</span><span style="left:50%;bottom:2px;transform:translateX(-50%)">▼</span><span style="right:4px;top:50%">右边下沉 ▶</span><span style="left:4px;top:50%">◀</span></div>
        <div>
          <div><label>俯仰/横滚：拖动方块 或 方向键 · Yaw</label></div>
          <input type="range" id="yaw" min="-180" max="180" value="0"> <span id="yawv">0°</span>
          <div class="row"><button id="level">水平复位</button><button id="flip">翻面</button><button id="shake">摇晃</button><button id="spin">自动旋转（磁力计校准）</button></div>
        </div>
      </div>
    </section>
    <section>
      <h2>麦克风（合成信号，非真实录音）</h2>
      <div class="row"><select id="mic"><option value="off">无麦克风</option><option value="quiet" selected>安静环境</option><option value="tone">1 kHz 纯音</option><option value="voice">类人声（谐波+共振峰）</option><option value="noise">宽带噪声</option><option value="sweep">扫频</option></select>
      <input type="range" id="micdb" min="-50" max="-8" value="-24"> <span id="micdbv">-24 dBFS</span></div>
      <div class="row"><label><input type="checkbox" id="snd"> 播放提示音（WebAudio，仅预览）</label><span id="fx"></span></div>
    </section>
    <section>
      <h2>扩展模块 / 电池 / 故障注入</h2>
      <div class="row"><label>左槽</label><select id="ml"><option value="none">无</option><option value="camera">摄像头</option><option value="unknown">未知</option></select>
      <label>右槽</label><select id="mr"><option value="none">无</option><option value="joystick">摇杆</option><option value="interact">交互</option><option value="buttonled">按钮+LED</option><option value="unknown">未知</option></select></div>
      <div class="row"><div class="pad" id="jpad" style="width:90px;height:90px"><i id="jdot"></i></div><span class="note">摇杆（需右槽=摇杆）</span></div>
      <div class="row"><label>电池</label><input type="range" id="bat" min="0" max="100" value="82"> <span id="batv">82%</span><label><input type="checkbox" id="chg"> 充电</label><label><input type="checkbox" id="nobat"> 无电池数据</label></div>
      <div class="row"><label><input type="checkbox" id="imuf"> IMU 无响应</label><label><input type="checkbox" id="nomag"> 无磁力计</label><label><input type="checkbox" id="heap"> 设备页显示示意内存数字（仅排版）</label></div>
    </section>
    <section>
      <h2>跳转 / 展会循环</h2>
      <div class="row"><button data-pg="home">首页</button><button data-pg="motion">运动</button><button data-pg="audio">AI·声音</button><button data-pg="game">游戏</button><button data-pg="device">设备</button></div>
      <div class="row"><button id="g0">游戏：简单（演示）</button><button id="g1">普通（演示）</button><button id="g2">困难（演示）</button></div>
      <div class="row"><label>时间倍速（测试 45 s 回首页 / 自动展示）</label><select id="speed"><option>1</option><option>5</option><option>10</option><option>30</option></select><button id="pause">暂停</button><button id="step">单步</button></div>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const post=(o)=>fetch('/ctl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).catch(()=>{});
// ---- screen as touch ----
const scr=$('screen'),img=$('frame');let down=false;
function pt(e){const r=scr.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)*480/r.width),y:Math.round((e.clientY-r.top)*480/r.height)}}
scr.onpointerdown=e=>{scr.setPointerCapture(e.pointerId);down=true;post({cmd:'pointer',down:true,...pt(e)})};
scr.onpointermove=e=>{if(down)post({cmd:'pointer',down:true,...pt(e)})};
scr.onpointerup=scr.onpointercancel=e=>{if(!down)return;down=false;post({cmd:'pointer',down:false,...pt(e)})};
// ---- frame loop ----
let busy=false;async function tick(){if(busy)return;busy=true;try{const r=await fetch('/frame.png?'+Date.now());const b=await r.blob();const u=URL.createObjectURL(b);const old=img.src;img.onload=()=>{if(old.startsWith('blob:'))URL.revokeObjectURL(old)};img.src=u}catch(e){}busy=false}
setInterval(tick,50);
// ---- attitude ----
let pitch=0,roll=0;const pad=$('pad'),dot=$('padDot');
function sendAtt(){post({cmd:'attitude',pitch,roll,yaw:+$('yaw').value});dot.style.left=(50+roll/60*50)+'%';dot.style.top=(50-pitch/60*50)+'%'}
function padSet(e){const r=pad.getBoundingClientRect();const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));roll=Math.round((x-.5)*120);pitch=Math.round((.5-y)*120);roll=Math.max(-60,Math.min(60,roll));pitch=Math.max(-60,Math.min(60,pitch));sendAtt()}
let pd=false;pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);pd=true;padSet(e)};pad.onpointermove=e=>{if(pd)padSet(e)};pad.onpointerup=()=>{pd=false};
$('yaw').oninput=e=>{$('yawv').textContent=e.target.value+'°';sendAtt()};
$('level').onclick=()=>{pitch=roll=0;$('yaw').value=0;$('yawv').textContent='0°';sendAtt()};
addEventListener('keydown',e=>{const k=e.key;if(!k.startsWith('Arrow'))return;e.preventDefault();const s=e.shiftKey?10:4;if(k=='ArrowUp')pitch=Math.min(60,pitch+s);if(k=='ArrowDown')pitch=Math.max(-60,pitch-s);if(k=='ArrowRight')roll=Math.min(60,roll+s);if(k=='ArrowLeft')roll=Math.max(-60,roll-s);sendAtt()});
let flipOn=false,spinOn=false;
$('flip').onclick=()=>{flipOn=!flipOn;$('flip').classList.toggle('on',flipOn);post({cmd:'flip',on:flipOn})};
$('shake').onclick=()=>post({cmd:'shake'});
$('spin').onclick=()=>{spinOn=!spinOn;$('spin').classList.toggle('on',spinOn);post({cmd:spinOn?'spin':'spin',on:spinOn})};
// ---- mic ----
function sendMic(){$('micdbv').textContent=$('micdb').value+' dBFS';post({cmd:'mic',mode:$('mic').value,db:+$('micdb').value})}
$('mic').onchange=sendMic;$('micdb').oninput=sendMic;
// ---- modules / battery / faults ----
const sendMods=()=>post({cmd:'modules',left:$('ml').value,right:$('mr').value});$('ml').onchange=sendMods;$('mr').onchange=sendMods;
const sendBat=()=>{$('batv').textContent=$('bat').value+'%';post({cmd:'battery',present:!$('nobat').checked,pct:+$('bat').value,charging:$('chg').checked})};
['bat','chg','nobat'].forEach(i=>$(i).oninput=sendBat);
$('imuf').onchange=e=>post({cmd:'imu_fault',on:e.target.checked});$('nomag').onchange=e=>post({cmd:'mag',on:!e.target.checked});$('heap').onchange=e=>post({cmd:'heap_demo',on:e.target.checked});
const jp=$('jpad'),jd=$('jdot');let jdn=false;function jset(e){const r=jp.getBoundingClientRect();const x=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2)),y=Math.max(-1,Math.min(1,-((e.clientY-r.top)/r.height-.5)*2));jd.style.left=(50+x*50)+'%';jd.style.top=(50-y*50)+'%';post({cmd:'joystick',x,y})}
jp.onpointerdown=e=>{jp.setPointerCapture(e.pointerId);jdn=true;jset(e)};jp.onpointermove=e=>{if(jdn)jset(e)};jp.onpointerup=()=>{jdn=false;jd.style.left=jd.style.top='50%';post({cmd:'joystick',x:0,y:0})};
// ---- navigation ----
document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>post({cmd:'goto',page:b.dataset.pg}));
[0,1,2].forEach(i=>$('g'+i).onclick=()=>post({cmd:'game_start',diff:i,demo:true}));
$('speed').onchange=e=>post({cmd:'speed',value:+e.target.value});
let paused=false;$('pause').onclick=()=>{paused=!paused;$('pause').classList.toggle('on',paused);post({cmd:'pause',on:paused})};$('step').onclick=()=>post({cmd:'step'});
const sendDbg=()=>post({cmd:'debug',layout:$('dbg_layout').checked,long_text:$('dbg_long').checked});$('dbg_layout').onchange=sendDbg;$('dbg_long').onchange=sendDbg;
$('shot').onclick=()=>{const a=document.createElement('a');a.href=img.src;a.download='mosaico-experience.png';a.click()};
// ---- effects (preview only) ----
let ac=null;const cues=['TAP','NAV','SUCCESS','FAIL','HIT','COUNTDOWN','GO','TEST_TONE'];
const freqs=[[880,.04],[660,.05],[880,.25],[196,.3],[140,.06],[740,.08],[1180,.18],[1000,.5]];
function beep(i){if(!$('snd').checked)return;ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freqs[i][0];g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+freqs[i][1])}
setInterval(async()=>{try{const fx=await (await fetch('/effects')).json();if(fx.length){$('fx').textContent=fx.slice(-3).map(e=>e[0]==1?('振动 '+e[1]+' ms'):('提示音 '+cues[e[1]])).join(' | ');fx.forEach(e=>{if(e[0]==2)beep(e[1])})}}catch(e){}},250);
// ---- state ----
setInterval(async()=>{try{const s=await (await fetch('/state')).json();const L=s.layout;const bad=L.text_overlaps+L.shape_overlaps+L.off_screen+L.small_targets+L.missing_glyphs;
$('b_layout').textContent='布局问题：'+bad+(L.truncated?'（截断 '+L.truncated+'）':'');$('b_layout').className='badge '+(bad?'bad':'good');
$('b_page').textContent='页面 '+['首页','运动','AI·声音','游戏','设备'][s.page]+(s.attract?' · 自动展示':'');
$('b_rate').textContent='逻辑 '+s.preview.logic_hz.toFixed(0)+' Hz · 渲染 '+s.host_render_ms.toFixed(1)+' ms（主机 CPU，非设备性能）';
const keys=['pitch','roll','yaw','yaw_absolute','imu_ok','mic_ok','mag_ok','magcal_running','magcal_done','mag_ut','vad','level_db','maze_phase','score','hits','falls','time_left','input','rf','ai','simulated'];
$('state').textContent=keys.map(k=>k+' = '+s[k]).join('\n')+(L.first_problem?'\n首个布局问题: '+L.first_problem:'')}catch(e){}},500);
sendAtt();sendDbg();
</script>
</body>
</html>
